<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Tyler's Diode Designs</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    .nf { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 40px 6vw; }
    .nf__code { font-family: var(--font-display); font-weight: 700; font-size: clamp(5rem, 22vw, 12rem); line-height: 1;
      background: var(--grad-sunset); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf h1 { font-size: clamp(1.6rem, 4vw, 2.6rem); margin: 6px 0 12px; }
    .nf p { color: var(--ink-soft); max-width: 44ch; margin: 0 auto 28px; }
    .nf img { width: 96px; margin: 0 auto 10px; filter: drop-shadow(0 12px 20px rgba(255,106,61,.35)); }
    .nf .btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <img src="/assets/img/logo.svg" alt="Tyler's Diode Designs" width="96" height="96" />
      <div class="nf__code">404</div>
      <h1>This layer didn't print.</h1>
      <p>The page you're after slipped off the build plate. Let's get you back to something solid.</p>
      <div class="btns">
        <a class="btn btn--primary btn--lg" href="/">Back to Home</a>
        <a class="btn btn--ghost btn--lg" href="/#shop">Browse the Shop</a>
      </div>
    </div>
  </main>
</body>
</html>
